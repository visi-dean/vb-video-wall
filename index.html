<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Video Wall</title>
<style>
  :root{
    --paper:#FFFFFF;
    --ink:#0B0B0C;
    --ink-70:rgba(11,11,12,0.62);
    --ink-40:rgba(11,11,12,0.34);
    --rule:rgba(11,11,12,0.13);
    --card-edge:rgba(11,11,12,0.16);
  }

  *{ box-sizing:border-box; }

  html, body{
    margin:0; padding:0; height:100%; width:100%;
    background:var(--paper); color:var(--ink);
    overflow:hidden;
  }

  body{
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    font-size:calc(11px + 0.45vw);
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }

  body.hide-cursor{ cursor:none; }

  .label{
    font-size:0.66em;
    font-weight:700;
    letter-spacing:0.17em;
    text-transform:uppercase;
    line-height:1;
  }

  .num{
    font-variant-numeric:tabular-nums;
    font-feature-settings:"tnum" 1;
  }

  /* ============ MENU ============ */

  #menu{
    position:absolute;
    top:0; left:0; right:0; bottom:0;
    display:block;
  }

  #menu.is-hidden{ display:none; }

  /* --- top bar --- */

  .topbar{
    position:absolute;
    top:0; left:0; right:0;
    z-index:30;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    padding:2.4vw 2.6vw 0 2.6vw;
    pointer-events:none;
  }

  .brand{
    border:1px solid var(--rule);
    padding:0.85em 1.15em;
    background:var(--paper);
  }

  .brand .label{ color:var(--ink); }
  .brand .label em{ font-style:normal; color:var(--ink-40); }

  .counter{
    border:1px solid var(--rule);
    padding:0.85em 1.15em;
    background:var(--paper);
    text-align:right;
  }

  .counter .big{
    font-size:1.5em;
    font-weight:800;
    letter-spacing:-0.03em;
    line-height:1;
    display:block;
  }

  .counter .label{ color:var(--ink-40); margin-top:0.55em; }

  /* --- the deck --- */

  #stage{
    position:absolute;
    top:0; left:0; right:0; bottom:0;
    perspective:1700px;
    perspective-origin:38% 52%;
    overflow:hidden;
  }

  #deck{
    position:absolute;
    top:0; left:0; width:100%; height:100%;
    transform-style:preserve-3d;
  }

  #deck.is-hidden{ display:none; }

  .plane{
    position:absolute;
    left:34%;
    top:53%;
    width:42vw;
    height:23.6vw;
    margin:0; padding:0; border:0;
    background:#F2F2F3;
    box-shadow:0 2px 40px rgba(11,11,12,0.13);
    outline:1px solid var(--card-edge);
    outline-offset:-1px;
    overflow:hidden;
    cursor:pointer;
    transform-origin:50% 50%;
    transition:transform .55s cubic-bezier(.22,.61,.36,1), opacity .45s ease, box-shadow .45s ease;
  }

  .plane-media{
    position:absolute;
    top:0; left:0;
    width:100%; height:100%;
    display:block;
    object-fit:cover;
    background:#F2F2F3;
  }

  .plane-num{
    position:absolute;
    top:0; left:0;
    z-index:2;
    padding:0.55em 0.85em;
    background:var(--paper);
    color:var(--ink);
    border-right:1px solid var(--card-edge);
    border-bottom:1px solid var(--card-edge);
  }

  .plane.is-front{ box-shadow:0 14px 70px rgba(11,11,12,0.22); }

  /* --- grid view --- */

  #grid{
    position:absolute;
    top:0; left:0; right:0; bottom:0;
    padding:9vw 2.6vw 14vw 2.6vw;
    overflow-y:auto;
    display:none;
  }

  #grid.is-visible{ display:block; }

  #grid-inner{
    display:flex;
    flex-wrap:wrap;
    margin:-0.7vw;
  }

  .tile{
    width:25%;
    padding:0.7vw;
    border:0; background:transparent;
    font:inherit; color:inherit; text-align:left;
    cursor:pointer;
  }

  .tile-frame{
    position:relative;
    width:100%;
    padding-top:56.25%;
    background:#F2F2F3;
    outline:1px solid var(--card-edge);
    outline-offset:-1px;
    overflow:hidden;
    transition:outline-color .18s ease;
  }

  .tile.is-front .tile-frame{
    outline:3px solid var(--ink);
    outline-offset:-3px;
  }

  .tile-caption{
    margin-top:0.8em;
    color:var(--ink-70);
  }

  .tile.is-front .tile-caption{ color:var(--ink); }

  /* --- bottom bar --- */

  .bottombar{
    position:absolute;
    left:0; right:0; bottom:0;
    z-index:30;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    padding:0 2.6vw 2.4vw 2.6vw;
    pointer-events:none;
  }

  .now{ max-width:46%; }

  .views{
    display:flex;
    margin-bottom:1.3em;
    pointer-events:auto;
  }

  .view-btn{
    border:1px solid var(--rule);
    border-right:0;
    background:var(--paper);
    color:var(--ink-40);
    padding:0.85em 1.3em;
    cursor:pointer;
    font:inherit;
  }

  .view-btn:last-child{ border-right:1px solid var(--rule); }
  .view-btn.is-on{ background:var(--ink); color:var(--paper); border-color:var(--ink); }

  #now-title{
    margin:0;
    font-size:3.5vw;
    font-weight:800;
    letter-spacing:-0.035em;
    line-height:0.98;
  }

  #now-note{
    margin:0.7em 0 0 0;
    color:var(--ink-40);
  }

  .pills{
    display:flex;
    flex-wrap:wrap;
    justify-content:flex-end;
    max-width:46%;
    margin:-0.28em;
    pointer-events:auto;
  }

  .pill{
    margin:0.28em;
    border:1px solid var(--rule);
    border-radius:2em;
    background:var(--paper);
    color:var(--ink-40);
    padding:0.7em 1.05em;
    cursor:pointer;
    font:inherit;
    white-space:nowrap;
    transition:background-color .18s ease, color .18s ease, border-color .18s ease;
  }

  .pill sup{
    font-size:0.78em;
    margin-left:0.5em;
    vertical-align:baseline;
    color:var(--ink-40);
  }

  .pill.is-on{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .pill.is-on sup{ color:rgba(255,255,255,0.6); }

  .keyhint{
    position:absolute;
    left:2.6vw; bottom:2.4vw;
    color:var(--ink-40);
    display:none;
  }

  #status{
    position:absolute;
    left:2.6vw; top:40%;
    max-width:32em;
    line-height:1.65;
    color:var(--ink-70);
  }

  #status strong{ display:block; font-size:1.5em; color:var(--ink); margin-bottom:0.5em; letter-spacing:-0.02em; }
  #status code{
    font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    border:1px solid var(--rule);
    padding:0.1em 0.4em;
  }

  /* ============ PLAYER ============ */

  #player{
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    background:#000;
    display:none;
    z-index:100;
  }

  #player.is-active{ display:block; }

  #video{
    width:100%; height:100%;
    display:block;
    background:#000;
    object-fit:contain;
  }

  #hud{
    position:absolute;
    top:0; left:0; right:0; bottom:0;
    opacity:1;
    transition:opacity .45s ease;
  }

  #hud.is-hidden{ opacity:0; pointer-events:none; }

  .hud-top{
    position:absolute;
    top:0; left:0; right:0;
    padding:2.2vw 2.6vw 5vw 2.6vw;
    background:linear-gradient(to bottom, rgba(0,0,0,0.72), rgba(0,0,0,0));
    color:#fff;
    pointer-events:none;
  }

  #hud-title{
    margin:0;
    font-size:2.1vw;
    font-weight:800;
    letter-spacing:-0.03em;
    line-height:1;
  }

  #hud-status{
    margin:0.85em 0 0 0;
    color:rgba(255,255,255,0.62);
  }

  .hud-bottom{
    position:absolute;
    left:0; right:0; bottom:0;
    padding:6vw 2.6vw 2.4vw 2.6vw;
    background:linear-gradient(to top, rgba(0,0,0,0.78), rgba(0,0,0,0));
    display:flex;
    justify-content:center;
  }

  .hud-btn{
    margin:0 0.4em;
    border:2px solid rgba(255,255,255,0.42);
    border-radius:2.4em;
    background:rgba(0,0,0,0.35);
    color:#fff;
    padding:0.95em 1.7em;
    font:inherit;
    cursor:pointer;
    transition:background-color .16s ease, color .16s ease, border-color .16s ease, transform .16s ease;
  }

  .hud-btn.is-on{
    background:#fff;
    color:#0B0B0C;
    border-color:#fff;
    transform:scale(1.06);
  }

  /* ============ Responsive ============ */

  @media (max-width:900px){
    body{ font-size:14px; }
    #stage{ display:none; }
    #grid{ display:block; padding:22vw 5vw 30vw 5vw; }
    .tile{ width:50%; }
    .views{ display:none; }
    .pills{ display:none; }
    #now-title{ font-size:7vw; }
    .now{ max-width:100%; }
    #hud-title{ font-size:5vw; }
    .hud-btn{ padding:0.8em 1.1em; }
  }

  @media (prefers-reduced-motion:reduce){
    .plane, .hud-btn, .pill, #hud{ transition:none; }
  }
</style>
</head>
<body>

<div id="menu">

  <div class="topbar">
    <div class="brand"><span class="label" id="brand-label">Video wall <em>&mdash; select to loop</em></span></div>
    <div class="counter">
      <span class="big num" id="counter-now">00</span>
      <span class="label num" id="counter-total">of 00</span>
    </div>
  </div>

  <div id="stage">
    <div id="deck"></div>
  </div>

  <div id="grid"><div id="grid-inner"></div></div>

  <div class="bottombar">
    <div class="now">
      <div class="views">
        <button class="view-btn is-on label" type="button" id="view-stack">Stack</button>
        <button class="view-btn label" type="button" id="view-grid">Grid</button>
      </div>
      <h1 id="now-title">Video wall</h1>
      <p class="label" id="now-note">&#9668; &#9658; browse &nbsp;&middot;&nbsp; OK play &nbsp;&middot;&nbsp; G change view</p>
    </div>
    <div class="pills" id="pills"></div>
  </div>

  <div id="status" style="display:none"></div>
</div>

<div id="player">
  <video id="video" playsinline webkit-playsinline preload="auto"></video>
  <div id="hud">
    <div class="hud-top">
      <p id="hud-title"></p>
      <p class="label" id="hud-status"></p>
    </div>
    <div class="hud-bottom" id="hud-buttons">
      <button class="hud-btn label" type="button" data-act="menu">&#9664;&nbsp; Menu</button>
      <button class="hud-btn label" type="button" data-act="prev">Previous</button>
      <button class="hud-btn label" type="button" data-act="next">Next &nbsp;&#9654;</button>
      <button class="hud-btn label" type="button" data-act="sound">Sound on</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var deck = document.getElementById('deck');
  var gridWrap = document.getElementById('grid');
  var gridInner = document.getElementById('grid-inner');
  var pillsEl = document.getElementById('pills');
  var statusEl = document.getElementById('status');
  var menuEl = document.getElementById('menu');
  var playerEl = document.getElementById('player');
  var videoEl = document.getElementById('video');
  var hudEl = document.getElementById('hud');
  var hudTitle = document.getElementById('hud-title');
  var hudStatus = document.getElementById('hud-status');
  var nowTitle = document.getElementById('now-title');
  var nowNote = document.getElementById('now-note');
  var brandLabel = document.getElementById('brand-label');
  var counterNow = document.getElementById('counter-now');
  var counterTotal = document.getElementById('counter-total');
  var viewStackBtn = document.getElementById('view-stack');
  var viewGridBtn = document.getElementById('view-grid');
  var hudButtons = [].slice.call(document.querySelectorAll('.hud-btn'));

  var videos = [];
  var planes = [];
  var tiles = [];
  var pills = [];
  var previews = [];

  var livePreviews = true;
  var focusIndex = 0;
  var currentIndex = -1;
  var playAll = false;
  var muted = true;
  var view = 'stack';
  var gridCols = 4;

  var hudVisible = true;
  var hudFocus = 0;
  var hudTimer = null;
  var cursorTimer = null;
  var idleTimer = null;
  var idleSeconds = 60;
  var wakeLock = null;

  function pad(n) { return (n < 10 ? '0' : '') + n; }

  /* ---------- Load ---------- */

  function load() {
    fetch('videos.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) { throw new Error('videos.json returned ' + res.status); }
        return res.json();
      })
      .then(function (data) {
        if (data && data.title) {
          brandLabel.innerHTML = data.title + ' <em>&mdash; select to loop</em>';
          document.title = data.title;
        }
        if (data && typeof data.autoStartSeconds === 'number') { idleSeconds = data.autoStartSeconds; }
        if (data && data.livePreviews === false) { livePreviews = false; }

        videos = (data && data.videos ? data.videos : []).filter(function (v) { return v && v.file; });

        if (!videos.length) {
          showStatus('Nothing in the playlist', 'Add an entry to <code>videos.json</code> and refresh.');
          return;
        }
        build();
        applyHash();
        resetIdle();
      })
      .catch(function (err) {
        showStatus('Could not read the playlist',
          'Check that <code>videos.json</code> sits beside <code>index.html</code> and is valid JSON.<br><br>Details: ' +
          String(err.message || err));
      });
  }

  function showStatus(heading, body) {
    statusEl.innerHTML = '<strong>' + heading + '</strong>' + body;
    statusEl.style.display = 'block';
  }

  /* ---------- Build ---------- */

  function build() {
    statusEl.style.display = 'none';
    deck.innerHTML = ''; gridInner.innerHTML = ''; pillsEl.innerHTML = '';
    planes = []; tiles = []; pills = []; previews = [];

    counterTotal.textContent = 'of ' + pad(videos.length);

    for (var i = 0; i < videos.length; i++) {
      planes.push(makePlane(videos[i], i));
      tiles.push(makeTile(videos[i], i));
      pills.push(makePill(videos[i], i));
    }
    measureGrid();
    setFocus(0);
  }

  function makeMedia(v, i, cls) {
    if (v.poster) {
      var img = document.createElement('div');
      img.className = cls;
      img.style.backgroundImage = 'url("' + v.poster + '")';
      img.style.backgroundSize = 'cover';
      img.style.backgroundPosition = 'center';
      return img;
    }
    var at = (typeof v.previewFrom === 'number') ? v.previewFrom : 0.4;
    var el = document.createElement('video');
    el.className = cls;
    el.muted = true; el.defaultMuted = true; el.loop = true;
    el.setAttribute('muted', '');
    el.setAttribute('playsinline', '');
    el.setAttribute('webkit-playsinline', '');
    el.setAttribute('preload', 'metadata');
    el.setAttribute('src', v.file + '#t=' + at);
    el.addEventListener('loadedmetadata', function (frame, node) {
      return function () {
        try { if (node.currentTime < 0.05) { node.currentTime = frame; } } catch (e) { /* no seek */ }
      };
    }(at, el));
    if (!previews[i]) { previews[i] = []; }
    previews[i].push(el);
    return el;
  }

  function makePlane(v, i) {
    var el = document.createElement('button');
    el.className = 'plane';
    el.type = 'button';
    el.appendChild(makeMedia(v, i, 'plane-media'));

    var n = document.createElement('span');
    n.className = 'plane-num label num';
    n.textContent = pad(i + 1);
    el.appendChild(n);

    el.addEventListener('click', function () {
      if (i === focusIndex) { play(i, false); } else { setFocus(i); }
    });
    deck.appendChild(el);
    return el;
  }

  function makeTile(v, i) {
    var btn = document.createElement('button');
    btn.className = 'tile';
    btn.type = 'button';

    var frame = document.createElement('div');
    frame.className = 'tile-frame';
    frame.appendChild(makeMedia(v, i, 'plane-media'));
    var n = document.createElement('span');
    n.className = 'plane-num label num';
    n.textContent = pad(i + 1);
    frame.appendChild(n);

    var cap = document.createElement('div');
    cap.className = 'tile-caption label';
    cap.textContent = v.title || ('Video ' + (i + 1));

    btn.appendChild(frame);
    btn.appendChild(cap);
    btn.addEventListener('click', function () {
      if (i === focusIndex) { play(i, false); } else { setFocus(i); }
    });
    gridInner.appendChild(btn);
    return btn;
  }

  function makePill(v, i) {
    var b = document.createElement('button');
    b.className = 'pill label';
    b.type = 'button';
    b.innerHTML = (v.short || v.title || ('Video ' + (i + 1))) + '<sup class="num">' + pad(i + 1) + '</sup>';
    b.addEventListener('click', function () { setFocus(i); });
    pillsEl.appendChild(b);
    return b;
  }

  function measureGrid() {
    if (!tiles.length) { return; }
    var w = gridInner.getBoundingClientRect().width;
    var tw = tiles[0].getBoundingClientRect().width;
    gridCols = Math.max(1, Math.round(w / (tw || w)));
  }

  /* ---------- Focus ---------- */

  function setFocus(i) {
    if (!videos.length) { return; }
    if (i < 0) { i = 0; }
    if (i > videos.length - 1) { i = videos.length - 1; }
    focusIndex = i;

    layoutDeck();

    for (var t = 0; t < tiles.length; t++) {
      tiles[t].className = (t === focusIndex) ? 'tile is-front' : 'tile';
      pills[t].className = (t === focusIndex) ? 'pill label is-on' : 'pill label';
    }

    var v = videos[focusIndex];
    nowTitle.textContent = v.title || ('Video ' + (focusIndex + 1));
    nowNote.innerHTML = v.note
      ? v.note
      : '&#9668; &#9658; browse &nbsp;&middot;&nbsp; OK play &nbsp;&middot;&nbsp; G change view';
    counterNow.textContent = pad(focusIndex + 1);

    if (view === 'grid') { scrollTileIntoView(tiles[focusIndex]); }
    updatePreviews();
  }

  function layoutDeck() {
    for (var i = 0; i < planes.length; i++) {
      var d = i - focusIndex;
      var el = planes[i];
      var op, x, y, z;

      if (d < 0) {
        // already passed: slide out towards the viewer, bottom-left
        x = d * 5 - 6; y = -d * 3 + 5; z = -d * 200 + 160;
        op = 0;
      } else {
        x = d * 7.1; y = d * -3.5; z = d * -150;
        op = Math.max(0.1, 1 - d * 0.135);
      }

      el.style.opacity = op;
      el.style.zIndex = String(200 - Math.abs(d));
      el.style.pointerEvents = (op < 0.2) ? 'none' : 'auto';
      el.style.transform =
        'translate(-50%, -50%) translate3d(' + x + 'vw, ' + y + 'vw, ' + z + 'px) ' +
        'rotateY(-31deg) rotateX(3deg)';
      el.className = (d === 0) ? 'plane is-front' : 'plane';
    }
  }

  function scrollTileIntoView(el) {
    var top = el.offsetTop;
    var bottom = top + el.offsetHeight;
    if (top < gridWrap.scrollTop) { gridWrap.scrollTop = top - 30; }
    else if (bottom > gridWrap.scrollTop + gridWrap.clientHeight) {
      gridWrap.scrollTop = bottom - gridWrap.clientHeight + 30;
    }
  }

  function setView(next) {
    view = next;
    var stack = (view === 'stack');
    deck.className = stack ? '' : 'is-hidden';
    document.getElementById('stage').style.display = stack ? 'block' : 'none';
    gridWrap.className = stack ? '' : 'is-visible';
    viewStackBtn.className = stack ? 'view-btn is-on label' : 'view-btn label';
    viewGridBtn.className = stack ? 'view-btn label' : 'view-btn is-on label';
    measureGrid();
    setFocus(focusIndex);
  }

  viewStackBtn.addEventListener('click', function () { setView('stack'); });
  viewGridBtn.addEventListener('click', function () { setView('grid'); });

  /* ---------- Previews ---------- */

  function updatePreviews() {
    for (var i = 0; i < previews.length; i++) {
      var group = previews[i];
      if (!group) { continue; }
      for (var j = 0; j < group.length; j++) {
        var el = group[j];
        if (livePreviews && i === focusIndex && currentIndex === -1) {
          var pr = el.play();
          if (pr && typeof pr.catch === 'function') { pr.catch(function () { /* frame still shows */ }); }
        } else {
          el.pause();
        }
      }
    }
  }

  function pauseAllPreviews() {
    for (var i = 0; i < previews.length; i++) {
      if (!previews[i]) { continue; }
      for (var j = 0; j < previews[i].length; j++) { previews[i][j].pause(); }
    }
  }

  /* ---------- Play ---------- */

  function play(i, all) {
    if (!videos[i]) { return; }
    currentIndex = i;
    playAll = !!all;
    pauseAllPreviews();

    var v = videos[i];
    videoEl.loop = !playAll;
    videoEl.muted = muted;
    videoEl.setAttribute('src', v.file);
    videoEl.load();

    menuEl.className = 'is-hidden';
    playerEl.className = 'is-active';

    hudTitle.textContent = v.title || ('Video ' + (i + 1));
    updateHudStatus();
    hudFocus = 0;
    showHud();

    var p = videoEl.play();
    if (p && typeof p.catch === 'function') {
      p.catch(function () { videoEl.muted = true; muted = true; updateHudStatus(); videoEl.play(); });
    }

    requestWakeLock();
    goFullscreen();
    clearIdle();
  }

  function stop() {
    videoEl.pause();
    videoEl.removeAttribute('src');
    videoEl.load();
    playerEl.className = '';
    menuEl.className = '';
    currentIndex = -1;
    playAll = false;
    if (location.hash) { history.replaceState(null, '', location.pathname + location.search); }
    measureGrid();
    setFocus(focusIndex);
    resetIdle();
  }

  function nextVideo() { play((currentIndex + 1) % videos.length, playAll); }
  function prevVideo() { play((currentIndex - 1 + videos.length) % videos.length, playAll); }

  videoEl.addEventListener('ended', function () { if (playAll) { nextVideo(); } });

  videoEl.addEventListener('error', function () {
    hudTitle.textContent = 'That file would not play';
    hudStatus.textContent = 'Check the path in videos.json — ' +
      (videos[currentIndex] ? videos[currentIndex].file : '');
    showHud(true);
  });

  function updateHudStatus() {
    var mode = playAll ? ('Playing all — ' + (currentIndex + 1) + ' of ' + videos.length) : 'Looping';
    hudStatus.textContent = mode + '  ·  ' + (muted ? 'Muted' : 'Sound on');
    hudButtons[3].textContent = muted ? 'Sound on' : 'Mute';
    paintHudFocus();
  }

  function toggleMute() {
    muted = !muted;
    videoEl.muted = muted;
    if (!muted) { videoEl.volume = 1; }
    updateHudStatus();
    showHud();
  }

  /* ---------- HUD ---------- */

  function paintHudFocus() {
    for (var i = 0; i < hudButtons.length; i++) {
      hudButtons[i].className = (i === hudFocus && hudVisible) ? 'hud-btn label is-on' : 'hud-btn label';
    }
  }

  function showHud(sticky) {
    hudVisible = true;
    hudEl.className = '';
    paintHudFocus();
    if (hudTimer) { clearTimeout(hudTimer); hudTimer = null; }
    if (!sticky) {
      hudTimer = setTimeout(hideHud, 4500);
    }
  }

  function hideHud() {
    hudVisible = false;
    hudEl.className = 'is-hidden';
    paintHudFocus();
  }

  function runHudAction(act) {
    if (act === 'menu') { stop(); }
    else if (act === 'next') { nextVideo(); }
    else if (act === 'prev') { prevVideo(); }
    else if (act === 'sound') { toggleMute(); }
  }

  for (var b = 0; b < hudButtons.length; b++) {
    (function (idx) {
      hudButtons[idx].addEventListener('click', function (e) {
        e.stopPropagation();
        hudFocus = idx;
        runHudAction(hudButtons[idx].getAttribute('data-act'));
      });
      hudButtons[idx].addEventListener('mouseenter', function () {
        hudFocus = idx; showHud();
      });
    })(b);
  }

  playerEl.addEventListener('mousemove', function () { if (!hudVisible) { showHud(); } });
  playerEl.addEventListener('click', function () { if (!hudVisible) { showHud(); } });

  /* ---------- Cursor and idle ---------- */

  function nudgeCursor() {
    document.body.classList.remove('hide-cursor');
    if (cursorTimer) { clearTimeout(cursorTimer); }
    cursorTimer = setTimeout(function () { document.body.classList.add('hide-cursor'); }, 3000);
  }

  function resetIdle() {
    clearIdle();
    if (idleSeconds > 0 && videos.length && currentIndex === -1) {
      idleTimer = setTimeout(function () { play(0, true); }, idleSeconds * 1000);
    }
  }

  function clearIdle() { if (idleTimer) { clearTimeout(idleTimer); idleTimer = null; } }

  /* ---------- Fullscreen and wake lock ---------- */

  function goFullscreen() {
    var el = document.documentElement;
    var fn = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if (fn && !document.fullscreenElement && !document.webkitFullscreenElement) {
      try { fn.call(el); } catch (e) { /* already fullscreen on TV */ }
    }
  }

  function requestWakeLock() {
    if (!navigator.wakeLock || wakeLock) { return; }
    try {
      navigator.wakeLock.request('screen').then(function (lock) {
        wakeLock = lock;
        lock.addEventListener('release', function () { wakeLock = null; });
      }).catch(function () { /* unsupported */ });
    } catch (e) { /* unsupported */ }
  }

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && currentIndex > -1) { requestWakeLock(); }
  });

  /* ---------- Deep links ---------- */

  function applyHash() {
    var h = (location.hash || '').replace('#', '');
    if (!h) { return; }
    if (h === 'play=all') { play(0, true); return; }
    var m = h.match(/^v=(\d+)$/);
    if (m) {
      var n = parseInt(m[1], 10) - 1;
      if (videos[n]) { setFocus(n); play(n, false); }
    }
  }

  window.addEventListener('hashchange', applyHash);
  window.addEventListener('resize', function () { measureGrid(); layoutDeck(); });

  /* ---------- Keys ---------- */

  document.addEventListener('keydown', function (e) {
    var k = e.keyCode;
    nudgeCursor();

    // Back: Escape, Backspace, LG webOS 461, Samsung Tizen 10009
    if (k === 27 || k === 8 || k === 461 || k === 10009) {
      e.preventDefault();
      if (currentIndex > -1) { stop(); }
      return;
    }

    if (k === 77) { if (currentIndex > -1) { toggleMute(); } return; }   // M
    if (k === 70) { goFullscreen(); return; }                            // F

    if (k === 71) {                                                      // G
      if (currentIndex === -1) { setView(view === 'stack' ? 'grid' : 'stack'); }
      return;
    }

    // Number keys jump straight to a video, 0 plays everything
    var n = -1;
    if (k >= 48 && k <= 57) { n = k - 48; }
    if (k >= 96 && k <= 105) { n = k - 96; }
    if (n > -1) {
      e.preventDefault();
      if (n === 0) { play(0, true); }
      else if (videos[n - 1]) { play(n - 1, false); }
      return;
    }

    if (currentIndex > -1) {
      // --- Playing ---
      if (!hudVisible) {
        // First press just wakes the controls up
        if (k === 37 || k === 39 || k === 38 || k === 40 || k === 13 || k === 32) {
          e.preventDefault(); showHud(); return;
        }
        return;
      }
      if (k === 37) { hudFocus = (hudFocus - 1 + hudButtons.length) % hudButtons.length; showHud(); e.preventDefault(); }
      if (k === 39) { hudFocus = (hudFocus + 1) % hudButtons.length; showHud(); e.preventDefault(); }
      if (k === 38 || k === 40) { hideHud(); e.preventDefault(); }
      if (k === 13 || k === 32) { runHudAction(hudButtons[hudFocus].getAttribute('data-act')); e.preventDefault(); }
      return;
    }

    // --- Menu ---
    resetIdle();
    if (view === 'stack') {
      if (k === 37 || k === 38) { setFocus(focusIndex - 1); e.preventDefault(); }
      if (k === 39 || k === 40) { setFocus(focusIndex + 1); e.preventDefault(); }
    } else {
      if (k === 37) { setFocus(focusIndex - 1); e.preventDefault(); }
      if (k === 39) { setFocus(focusIndex + 1); e.preventDefault(); }
      if (k === 38) { setFocus(focusIndex - gridCols); e.preventDefault(); }
      if (k === 40) { setFocus(focusIndex + gridCols); e.preventDefault(); }
    }
    if (k === 13 || k === 32) { play(focusIndex, false); e.preventDefault(); }
  });

  document.addEventListener('mousemove', function () {
    nudgeCursor();
    if (currentIndex === -1) { resetIdle(); }
  });

  nudgeCursor();
  load();
})();
</script>
</body>
</html>
